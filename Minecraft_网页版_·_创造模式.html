#start p{margin:0;font-size:14px;color:#ddd}
#inv{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}

.cell{width:44px;height:44px;background:#8b8b8b;border:2px solid #555;display:flex;align-items:center;justify-content:center;cursor:pointer}

if(eatT>=1.6){eatT=0;hunger=Math.min(20,hunger+fd.h);snd('burp');if(fd.g){$('flash').style.opacity=.55;setTimeout(()=>$('flash').style.opacity=0,300);toast('金苹果：获得再生与吸收效果！')}else toast('吃掉了'+fd.n);bars()}}
else{eatT=0;if(fullT<=0){toast('已经吃饱了');fullT=1.5}}}else if(cd<=0&&hh){placeB(hh);cd=.2}}else eatT=0;

if(d.age>.6&&ds<2.6){d.x+=dx/ds*dt*7;d.y+=dy/ds*dt*7;d.z+=dz/ds*dt*7;d.g=false;if(ds<.55){scene.remove(d.m);drops.splice(i,1);snd('pop');continue}}
else{d.vy-=20*dt;const nx=d.x+d.vx*dt,nz=d.z+d.vz*dt,ny=d.y+d.vy*dt;
if(solid(Math.floor(nx),Math.floor(d.y),Math.floor(d.z)))d.vx*=-.3;else d.x=nx;if(solid(Math.floor(d.x),Math.floor(d.y),Math.floor(nz)))d.vz*=-.3;else d.z=nz;
if(solid(Math.floor(d.x),Math.floor(ny-.14),Math.floor(d.z))){if(d.vy<-3)d.vy*=-.35;else d.vy=0;d.vx*=.85;d.vz*=.85;d.g=true}else{d.y=ny;d.g=false}}

d.m.position.set(d.x,d.y+(d.g?Math.sin(d.age*2.5)*.05+.1:0),d.z);d.m.rotation.y=d.age*1.8}}

sun.position.set(cam.position.x+70,cam.position.y+90,cam.position.z-70);sun.lookAt(cam.position);
